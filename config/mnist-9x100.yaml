  - certification_model_type : "TargetedSDP"
    solver: "mosek_classic"
    cuts :
    - "RLT"
    - "triangularization"
    RLT_props :
    - 0.2
    all_combinations_cuts : false
    CHORDAL_DECOMPOSITION: true   # grouping standard [k,k+1] -- indispensable pour espérer <=2s/résolution sur ce réseau (un bloc SDP global serait bien trop gros)
    LAST_LAYER: false
    use_callback : false
    use_active_neurons: true
    use_inactive_neurons : false
    keep_penultimate_actives : true
    bounds_method: "from_file"
    bounds_file : "data/bounds/9x100-0.026_linf.csv"
    solver_time_limit: 2   # dparam MOSEK optimizer_max_time -- appliqué au task réutilisé par resolve_dualized() à CHAQUE itération du bundle, donc plafonne bien chaque résolution SDP individuelle (pas cumulatif)
    dynamic_conic_bundle:
      enabled: true
      dualize: ["RLT"]
      engine: "conicbundle_native"
      max_iter: 5
      term_relprec: 1.0e-7
      log_every : 1
      print_level: 1     # trace native ConicBundle par itération (0 = silencieux)
      eval_limit: 10
      print_png : true
      max_bundle_size : 200
      # factor : 0.1   # équivalent du FACTOR de MIQCR, transposé aux contraintes RLT dualisables : si renseigné (et max_bundle_size absent), max_bundle_size = max(1, round(factor * nb_contraintes_dualizable))
