data :
  name : "mnist"
  path : "data/datasets/mnist_subset_10_per_class.pth"
  num_classes : 10
  num_samples : 100


divide_run : 1

input_ball : 
  epsilon : 0.026
  norm : "Linf"

network :
  name : "9x100"
  path : "data/models/mnist_adv_9x100.pt"
  K : 10
  n : 
    - 784
    - 100
    - 100
    - 100
    - 100
    - 100
    - 100
    - 100
    - 100
    - 100
    - 10


