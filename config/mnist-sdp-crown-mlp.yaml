data :
  name : "mnist"
  path : "data/datasets/mnist_subset_10_per_class.pth"
  num_classes : 10
  num_samples : 100

input_ball : 
  norm : "L2"
  epsilon : 1  # 0.026

network :
  name : "2x100"
  path : "data/models/SDP-CROWN/mnist_mlp.pth"
  K : 3
  n : 
    - 784
    - 100
    - 100
    - 10



