data :
  name : "cifar100"
  path : "data/datasets/cifar100_subset_10_per_class.pth"
  num_classes : 100
  num_samples : 1000

input_ball:
  # epsilon : 0.03137 # 8/255
  # epsilon : 0.015686 # 4/255
  # epsilon : 0.007843 # 2/255
  # epsilon : 0.003922 # 1/255
  epsilon: 0.001
  norm : "Linf"

divide_run : 1


network :
  name : "fcna-cifar100"
  path : "data/models/cifar100_adv_fcna-cifar100.pt"
  K : 3
  n :
    - 3072
    - 20
    - 20
    - 100



