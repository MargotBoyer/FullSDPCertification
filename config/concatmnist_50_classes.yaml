data :
  name : "mnist"
  path :  "data/datasets/MNIST/ConcatMNIST/50_classes/concatmnist_subset_1_per_class.pth"
  num_classes : 50
  num_samples : 50

divide_run : 2

input_ball : 
  epsilon : 0.01
  norm : "Linf"

network :
  name : "concatmnist-6x100-50-classes"
  path : "data/models/concatmnist_adv_concatmnist-6x100-50-classes.pt"
  K : 7
  n : 
    - 784
    - 100
    - 100
    - 100
    - 100
    - 100
    - 100
    - 50



