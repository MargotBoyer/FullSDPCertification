data :
  name : "blob"
  path : "data/datasets/blob_dataset.pth"
  num_classes : 3
  num_samples : 1000

input_ball:
  norm : "Linf"
  epsilon : 1

divide_run : 1

network :
  name : "blob_nn_4x10"
  path : "data/models/blob_adv_blob_nn_4x10.pt"
  K : 5
  n :
  - 2
  - 10
  - 10
  - 10
  - 10
  - 3

models :
  - certification_model_type : "UntargetedSDP"
    write_model: true
    solver : "mosek_classic"
    cuts : 
    - "RLT"
    - "triangularization"
    - "McCormick_beta_z"
    - "beta_logits_comparaison"
    - "beta_logits_comparaison_big_M"
    - "sum_beta_logits_equal_logit"
    RLT_props : 
    - 1.
    all_combinations_cuts : false
    CHORDAL_DECOMPOSITION: false
    # - [0,1]
    # - [1,2,3]
    # - [3,4,5,6]
    LAST_LAYER: false
    INPUT_IN_VARIABLES : true
    solver: "mosek_classic"
    use_callback : false # Whether to use the callback for MOSEK
    use_active_neurons: true # Whether to use active neurons in the certification problem as variables
    #ultimate_layer_use_active_neurons: 5 # Whether to use active neurons in the ultimate layer in the certification problem as variables
    use_inactive_neurons : false # Whether to use inactive neurons in the certification problem as variables
    keep_penultimate_actives : true # Whether to keep the penultimate layer active neurons in the certification problem
    #bounds_file: "data/bounds/blob_4x10-0.5_linf.csv"  # Folder where precomputed bounds are stored
    bounds_method: "IBP"   #"alpha-CROWN"  # Method to compute bounds, options: "IBP", "GREAT_BOUNDS", "GREAT_BOUNDS_LIN"

  - certification_model_type : "UntargetedSDP"
    write_model: true
    solver : "mosek_classic"
    cuts : 
    - "RLT"
    - "triangularization"
    - "McCormick_beta_z"
    - "beta_logits_comparaison"
    - "beta_logits_comparaison_big_M"
    - "sum_beta_logits_equal_logit"
    RLT_props : 
    - 1.
    all_combinations_cuts : false
    CHORDAL_DECOMPOSITION: false
    # - [0,1]
    # - [1,2,3]
    # - [3,4,5,6]
    LAST_LAYER: false
    INPUT_IN_VARIABLES : true
    solver: "mosek_classic"
    use_callback : false # Whether to use the callback for MOSEK
    use_active_neurons: true # Whether to use active neurons in the certification problem as variables
    #ultimate_layer_use_active_neurons: 5 # Whether to use active neurons in the ultimate layer in the certification problem as variables
    use_inactive_neurons : false # Whether to use inactive neurons in the certification problem as variables
    keep_penultimate_actives : true # Whether to keep the penultimate layer active neurons in the certification problem
    bounds_method: "IBP"   #"alpha-CROWN"  # Method to compute bounds, options: "IBP", "GREAT_BOUNDS", "GREAT_BOUNDS_LIN"
    dynamic_conic_bundle:
      enabled: true
      dualize: ["RLT"]
      engine: "conicbundle_native"
      max_iter: 2000
      term_relprec: 1.0e-7
      eval_limit: 5000


  
